<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denah & Data Tanaman Bedengan</title>
<style>
  :root{
    --bg:#f2f5ef; --card:#ffffff; --ink:#1e2b1a; --muted:#68795f;
    --green:#2f7a46; --green-d:#1f5c33; --green-l:#e6f2e7;
    --amber:#d9992b; --red:#c0492f; --blue:#3b6ea5;
    --line:#e3e9dd; --shadow:0 4px 16px rgba(38,58,32,.09);
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:
    radial-gradient(1200px 500px at 100% -10%, #dcecd7 0%, transparent 60%),
    radial-gradient(900px 400px at -10% 0%, #e8f0df 0%, transparent 55%),
    var(--bg);
    color:var(--ink);min-height:100vh}
  /* ===== HEADER ===== */
  header{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,#173d24,#2f7a46 55%,#3c9a58);
    color:#fff;padding:16px 26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    justify-content:space-between;box-shadow:0 4px 18px rgba(23,61,36,.35);backdrop-filter:blur(6px)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    border:1px solid rgba(255,255,255,.25)}
  header h1{font-size:19px;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  .head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .clock{font-size:12px;background:rgba(255,255,255,.16);padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.2)}
  .hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s}
  .hbtn:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
  /* ===== LAYOUT ===== */
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 30px}
  /* ===== STATS ===== */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.2s}
  .stat:hover{transform:translateY(-3px)}
  .stat::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;opacity:.1}
  .stat .ic{font-size:20px}
  .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-top:6px}
  .stat .val{font-size:26px;font-weight:800;margin-top:3px}
  .val.green{color:var(--green)} .val.amber{color:var(--amber)} .val.red{color:var(--red)} .val.blue{color:var(--blue)}
  /* ===== TABS ===== */
  .tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
  .tab{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 17px;cursor:pointer;
    font-size:14px;font-weight:700;color:var(--muted);transition:.18s;box-shadow:var(--shadow)}
  .tab small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:1px}
  .tab:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px)}
  .tab.active{background:linear-gradient(120deg,var(--green),#3c9a58);color:#fff;border-color:transparent}
  /* ===== BLOCK INFO ===== */
  .block-info{background:linear-gradient(120deg,#fff,#fbfdf9);border:1px solid var(--line);
    border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .block-info h2{font-size:17px;display:flex;align-items:center;gap:8px}
  .block-info h2 .bc{width:14px;height:14px;border-radius:4px;display:inline-block}
  .block-info p{font-size:13px;color:var(--muted);margin-top:4px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .legend span{font-size:11.5px;display:flex;align-items:center;gap:6px;background:#f4f7f0;
    padding:4px 10px;border-radius:14px;border:1px solid var(--line)}
  .dot{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.12)}
  /* ===== BED GRID ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
  .bed{background:var(--card);border:1px solid var(--line);border-top:4px solid #d3cec0;border-radius:12px;
    padding:12px 13px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);position:relative;animation:pop .3s ease backwards}
  .bed:nth-child(2){animation-delay:.02s}.bed:nth-child(3){animation-delay:.04s}.bed:nth-child(4){animation-delay:.06s}
  .bed:nth-child(5){animation-delay:.08s}.bed:nth-child(6){animation-delay:.10s}.bed:nth-child(n+7){animation-delay:.12s}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bed:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(38,58,32,.15)}
  .bed .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .bed .id{font-weight:800;font-size:13px}
  .bed .emo{font-size:19px}
  .bed .crop{font-size:12px;margin-top:4px;color:var(--muted);min-height:16px}
  .bed .hst{font-size:11px;margin-top:7px;display:inline-block;background:var(--green-l);color:var(--green-d);
    border-radius:12px;padding:3px 10px;font-weight:700}
  .bed .bar{height:5px;background:#edf0e8;border-radius:4px;margin-top:8px;overflow:hidden}
  .bed .bar i{display:block;height:100%;border-radius:4px}
  .bed .fert{font-size:10.5px;margin-top:6px;font-weight:600}
  .fert.ok{color:var(--green)} .fert.soon{color:var(--amber)} .fert.over{color:var(--red)} .fert.done{color:#98a494}
  .bed.empty{background:repeating-linear-gradient(45deg,#fff,#fff 8px,#fafbf7 8px,#fafbf7 16px)}
  .bed.empty .crop{font-style:italic;color:#a8ad9f}
  .bed .plus{position:absolute;right:10px;bottom:10px;width:22px;height:22px;border-radius:50%;
    background:var(--green-l);color:var(--green);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .bed.empty:hover .plus{background:var(--green);color:#fff}
  /* ===== MODAL ===== */
  .overlay{position:fixed;inset:0;background:rgba(18,32,15,.55);display:none;align-items:center;
    justify-content:center;z-index:60;padding:16px;backdrop-filter:blur(4px)}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:500px;width:100%;max-height:92vh;overflow-y:auto;
    padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:mup .25s ease}
  @keyframes mup{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .modal h3{font-size:18px;display:flex;align-items:center;gap:8px}
  .modal .mid{font-size:12px;color:var(--muted);margin:3px 0 6px}
  .sec{background:#f7f9f4;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  .sec-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--green-d);margin-bottom:8px}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:11px 0 4px}
  select,input[type=text],input[type=date],input[type=number]{width:100%;padding:10px 11px;border:1.5px solid var(--line);
    border-radius:9px;font-size:14px;background:#fdfefa;transition:.15s;font-family:inherit}
  select:focus,input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(47,122,70,.12)}
  .row{display:flex;gap:10px} .row>div{flex:1}
  .fert-list{margin-top:4px}
  .fert-item{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .fert-item input[type=text]{flex:2} .fert-item input[type=number]{flex:1}
  .btn{border:none;border-radius:10px;padding:11px 17px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.97)}
  .btn-g{background:linear-gradient(120deg,var(--green),#3c9a58);color:#fff;box-shadow:0 3px 10px rgba(47,122,70,.3)}
  .btn-g:hover{filter:brightness(1.07)}
  .btn-o{background:#eef2e7;color:var(--ink)} .btn-o:hover{background:#e2e9d8}
  .btn-r{background:#f8e4dd;color:var(--red)} .btn-r:hover{background:#f3d5cc}
  .btn-x{background:#f1f3ec;color:var(--muted)}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;background:var(--green);color:#fff;border:none;cursor:pointer;font-weight:700}
  .btn-sm:hover{filter:brightness(1.08)}
  .modal-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .history{font-size:11px;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  .history b{color:var(--green-d)}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:26px 16px}
  @media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}.head-right{width:100%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🌾</div>
    <div>
      <h1>Denah & Data Tanaman Bedengan</h1>
      <div class="sub">Blok A: Lahan Kopi • Blok B–F: 121 bedengan • HST &amp; pemupukan otomatis</div>
    </div>
  </div>
  <div class="head-right">
    <span class="clock" id="clock"></span>
    <button class="hbtn" id="exportBtn">⬇ Export</button>
    <button class="hbtn" id="importBtn">⬆ Import</button>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div class="block-info" id="blockInfo"></div>
  <div class="grid" id="grid"></div>
</div>
<footer>🌱 Data tersimpan otomatis di browser ini • Gunakan Export/Import untuk backup atau pindah perangkat</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mTitle">Bedengan</h3>
    <div class="mid" id="mSub"></div>

    <div class="sec">
      <div class="sec-t">🌱 Data Tanaman</div>
      <label>Nama Tanaman</label>
      <select id="mCrop"></select>
      <div class="row">
        <div><label>Varietas</label><input type="text" id="mVar" placeholder="mis. Kopisus / Lokal"></div>
        <div><label>Tanggal Tanam</label><input type="date" id="mDate"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label>HST saat ini</label><input type="text" id="mHST" readonly style="background:var(--green-l);font-weight:800;color:var(--green-d)"></div>
        <div><label>Fase Pertumbuhan</label><input type="text" id="mStatus" readonly style="background:#fdf3e0;font-weight:700;color:#9a6b14"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-t">🧪 Jadwal Pemupukan (nama pupuk & sasaran HST)</div>
      <div class="fert-list" id="mFert"></div>
      <button class="btn-sm" id="addFert" style="margin-top:4px">+ Tambah Jadwal Pupuk</button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-g" id="saveBtn">💾 Simpan</button>
      <button class="btn btn-o" id="harvBtn">✅ Panen / Kosongkan</button>
      <button class="btn btn-r" id="delBtn">🗑 Hapus Data</button>
      <button class="btn btn-x" id="closeBtn">Tutup</button>
    </div>
    <div class="history" id="mHist"></div>
  </div>
</div>

<script>
/* ================= KONFIGURASI ================= */
const BLOCKS = [
  {id:"A", name:"Lahan Kopi", beds:0, color:"#8a5a3b"},
  {id:"B", name:"Blok B", beds:23, color:"#2f7a46"},
  {id:"C", name:"Blok C", beds:23, color:"#3c9a58"},
  {id:"D", name:"Blok D", beds:25, color:"#4fae6b"},
  {id:"E", name:"Blok E", beds:25, color:"#6cc084"},
  {id:"F", name:"Blok F", beds:25, color:"#8bd09d"},
];
/* Katalog tanaman lengkap per kategori */
const CROP_CATALOG = [
  {cat:"Sayuran Buah", items:["Cabai Merah","Cabai Rawit","Cabai Keriting","Tomat","Tomat Cherry","Terong","Terong Hijau","Timun","Tomat Hijau","Pare","Gambas (Oyong)","Labu Siam","Labu Air","Labu Kuning","Jamur Merang","Jagung Manis","Jagung Hibrida"]},
  {cat:"Sayuran Daun", items:["Bayam","Bayam Merah","Kangkung","Sawi Hijau","Sawi Putih","Sawi Manis (Pakcoy)","Selada","Selada Romaine","Kubis","Kubis Merah","Brokoli","Kembang Kol","Caisim","Bok Choy","Daun Bawang","Seledri","Kemangi","Daun Singkong","Daun Pepaya","Kenikir"]},
  {cat:"Umbi-umbian", items:["Kentang","Ubi Jalar","Ubi Ungu","Singkong","Talas","Gembili","Wortel","Bengkuang","Lobak"]},
  {cat:"Bawang-bawangan", items:["Bawang Merah","Bawang Putih","Bawang Bombay","Kucai"]},
  {cat:"Palawija & Pangan", items:["Padi / Padi Gogo","Jagung Hibrida","Jagung Manis","Kedelai","Kacang Hijau","Kacang Tanah","Sorgum"]},
  {cat:"Buah-buahan (Semusim)", items:["Semangka","Melon","Melon Golden","Semangka Non-Biji","Lemon","Timun Jepang"]},
  {cat:"Kacang-kacangan Sayur", items:["Kacang Panjang","Buncis","Kacang Kapri","Toge (Tauge)"]},
  {cat:"Rempah, Obat & Herbal", items:["Jahe","Jahe Merah","Kunyit","Kencur","Lengkuas","Temulawak","Serai","Lidah Buaya","Kayu Manis","Vanili"]},
  {cat:"Tanaman Tahunan / Perkebunan", items:["Kopi","Kopi Robusta","Kopi Arabika","Kakao","Lada","Teh","Cengkeh","Pala","Nilam"]},
  {cat:"Sayuran Lainnya", items:["Asparagus","Bit","Selada Air","Talas Bogor","Lobak Merah"]},
];
const EXTRA = ["Lainnya / Campuran"];
const STORE_KEY = "denahBedengan_v2";

/* Warna & ikon per tanaman */
const CROP_STYLE = {
  "Cabai Merah":["#c0392b","🌶️"],"Cabai Rawit":["#e74c3c","🌶️"],"Cabai Keriting":["#d35400","🌶️"],"Cabai Hijau":["#27ae60","🌶️"],
  "Tomat":["#e67e22","🍅"],"Tomat Cherry":["#e74c3c","🍅"],"Tomat Hijau":["#16a085","🍅"],
  "Terong":["#8e44ad","🍆"],"Terong Hijau":["#27ae60","🍆"],"Timun":["#2ecc71","🥒"],"Timun Jepang":["#58d68d","🥒"],
  "Pare":["#7cb342","🥒"],"Gambas (Oyong)":["#66bb6a","🥒"],"Labu Siam":["#8bc34a","🎃"],"Labu Air":["#aed581","🎃"],"Labu Kuning":["#f39c12","🎃"],
  "Jamur Merang":["#a1887f","🍄"],"Jagung Manis":["#f1c40f","🌽"],"Jagung Hibrida":["#f39c12","🌽"],
  "Bayam":["#1abc9c","🥬"],"Bayam Merah":["#c0392b","🥬"],"Kangkung":["#0e8f6e","🥬"],
  "Sawi Hijau":["#27ae60","🥬"],"Sawi Putih":["#dfe6dd","🥬"],"Sawi Manis (Pakcoy)":["#2ecc71","🥬"],
  "Selada":["#7fbf3f","🥗"],"Selada Romaine":["#6aa84f","🥗"],"Kubis":["#8bc34a","🥬"],"Kubis Merah":["#9b59b6","🥬"],
  "Brokoli":["#2e8b57","🥦"],"Kembang Kol":["#e8e8d5","🥦"],"Caisim":["#16a085","🥬"],"Bok Choy":["#48c9b0","🥬"],
  "Daun Bawang":["#7cb342","🧅"],"Seledri":["#52be80","🌿"],"Kemangi":["#58d68d","🌿"],"Daun Singkong":["#229954","🍃"],"Daun Pepaya":["#27ae60","🍃"],"Kenikir":["#f4d03f","🌼"],
  "Kentang":["#d4ac0d","🥔"],"Ubi Jalar":["#e67e22","🍠"],"Ubi Ungu":["#8e44ad","🍠"],"Singkong":["#b7950b","🥔"],"Talas":["#7d6608","🥔"],"Gembili":["#9a7d0a","🥔"],
  "Wortel":["#e67e22","🥕"],"Bengkuang":["#f5e6ca","🥔"],"Lobak":["#ecf0f1","🥕"],"Lobak Merah":["#e74c3c","🥕"],
  "Bawang Merah":["#d35400","🧅"],"Bawang Putih":["#f7f1de","🧄"],"Bawang Bombay":["#f0e6c8","🧅"],"Kucai":["#52be80","🌿"],
  "Padi / Padi Gogo":["#7fbf3f","🌾"],"Kedelai":["#b8a33e","🫘"],"Kacang Hijau":["#7d9b45","🫘"],"Kacang Tanah":["#c8a165","🥜"],"Sorgum":["#d4a017","🌾"],
  "Semangka":["#27ae60","🍉"],"Melon":["#f1c40f","🍈"],"Melon Golden":["#f5b041","🍈"],"Semangka Non-Biji":["#2ecc71","🍉"],"Lemon":["#f7dc6f","🍋"],
  "Kacang Panjang":["#16a085","🫛"],"Buncis":["#58d68d","🫛"],"Kacang Kapri":["#7dcea0","🫛"],"Toge (Tauge)":["#d5dbdb","🌱"],
  "Jahe":["#d4a017","🫚"],"Jahe Merah":["#c0392b","🫚"],"Kunyit":["#f39c12","🫚"],"Kencur":["#e8daab","🫚"],"Lengkuas":["#b9a44c","🫚"],"Temulawak":["#e59866","🫚"],
  "Serai":["#7cb342","🌿"],"Lidah Buaya":["#48c9b0","🌵"],"Kayu Manis":["#8a5a3b","🌿"],"Vanili":["#7e5109","🌿"],
  "Kopi":["#6f4e37","☕"],"Kopi Robusta":["#5d4037","☕"],"Kopi Arabika":["#8d6e63","☕"],"Kakao":["#795548","🍫"],"Lada":["#2c3e50","⚫"],"Teh":["#27ae60","🍵"],"Cengkeh":["#8a3324","🌿"],"Pala":["#b9770e","🌰"],"Nilam":["#566573","🌿"],
  "Asparagus":["#7cb342","🌱"],"Bit":["#8e2f42","🌱"],"Selada Air":["#52be80","🥗"],"Talas Bogor":["#7d6608","🥔"],"Lainnya / Campuran":["#7f8c8d","🌱"],
};
function cropStyle(c){ return CROP_STYLE[c] || ["#7f8c8d","🌱"]; }

let state = load();
let curBlock = "B", curBed = null;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && s.data) return s; }catch(e){}
  return {data:{}, hist:{}};
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hst(tanam){ if(!tanam) return null; const ms = new Date(today()) - new Date(tanam); return Math.max(0, Math.floor(ms/86400000)); }

/* ================= JAM ================= */
setInterval(()=>{ document.getElementById("clock").textContent =
  new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + " • " +
  new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}); }, 1000);

/* ================= DASHBOARD ================= */
function renderStats(){
  let total=0, planted=0, kosong=0, fertDue=0;
  BLOCKS.forEach(b=>{ for(let i=1;i<=b.beds;i++){ total++;
    const d = state.data[b.id+i];
    if(d && d.crop){ planted++; fertDue += fertAlert(d); } else kosong++;
  }});
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="ic">🟫</div><div class="lbl">Total Bedengan</div><div class="val blue">${total}</div></div>
    <div class="stat"><div class="ic">🌱</div><div class="lbl">Terisi Tanaman</div><div class="val green">${planted}</div></div>
    <div class="stat"><div class="ic">⬜</div><div class="lbl">Kosong</div><div class="val">${kosong}</div></div>
    <div class="stat"><div class="ic">🧪</div><div class="lbl">Pupuk Mendekat / Telat</div><div class="val ${fertDue?'red':'green'}">${fertDue}</div></div>`;
}
function fertAlert(d){
  if(!d.crop || !d.fert || !d.fert.length || !d.tanam) return 0;
  const h = hst(d.tanam);
  return d.fert.filter(f=>!f.done && f.hst - h <= 3).length;
}

/* ================= TAB BLOK ================= */
function renderTabs(){
  document.getElementById("tabs").innerHTML = BLOCKS.map(b=>{
    const filled = b.beds ? Array.from({length:b.beds},(_,i)=>state.data[b.id+(i+1)]).filter(x=>x&&x.crop).length : null;
    return `<div class="tab ${b.id===curBlock?'active':''}" onclick="openBlock('${b.id}')">
      ${b.beds? "🟩":"☕"} Blok ${b.id}<small>${b.beds? b.beds+" bedengan • "+filled+" terisi":"Lahan Kopi"}</small></div>`;
  }).join("");
}

/* ================= TAMPILAN BLOK ================= */
function openBlock(id){ curBlock=id; renderTabs(); renderBlock(); }
function renderBlock(){
  const b = BLOCKS.find(x=>x.id===curBlock);
  let inner = `<h2><span class="bc" style="background:${b.color}"></span> Blok ${b.id} — ${b.name}</h2>
    <p>${b.beds? b.beds+" bedengan. Klik bedengan untuk mengatur tanaman, HST, dan jadwal pemupukan."
        :"Lahan kopi (tanaman tahunan). Klik kartu untuk mengelola data tanaman kopi."}</p>`;
  if(curBlock!=="A"){
    const used = {};
    for(let i=1;i<=b.beds;i++){ const d=state.data[b.id+i]; if(d&&d.crop) used[d.crop]=(used[d.crop]||0)+1; }
    const cols = Object.entries(used).sort((a,z)=>z[1]-a[1]).map(([c,n])=>{
      const [col,emo] = cropStyle(c);
      return `<span><span class="dot" style="background:${col}"></span>${emo} ${c} (${n})</span>`;
    }).join("");
    inner += `<div class="legend">${cols||"<span>Belum ada tanaman — semua bedengan kosong.</span>"}
      <span><span class="dot" style="background:#d3cec0"></span>⬜ Kosong</span></div>`;
  }
  document.getElementById("blockInfo").innerHTML = inner;

  let cards = "";
  if(curBlock==="A"){
    const d = state.data["A1"];
    const [col,emo] = d&&d.crop ? cropStyle(d.crop) : ["#8a5a3b","☕"];
    cards = `<div class="bed" style="grid-column:1/-1;border-top-color:${col}" onclick="openBed('A1')">
      <div class="top"><div class="id">☕ Blok A — Lahan Kopi</div><div class="emo">${emo}</div></div>
      <div class="crop">${d&&d.crop? d.crop+(d.varietas?" • "+d.varietas:"")+" — HST "+hst(d.tanam):"Klik untuk mengatur data tanaman kopi"}</div>
      ${d&&d.crop? `<div class="hst">HST ${hst(d.tanam)}</div>${fertInfo(d)}`:""}</div>`;
  } else {
    for(let i=1;i<=b.beds;i++){
      const d = state.data[b.id+i];
      if(d && d.crop){
        const [col,emo] = cropStyle(d.crop);
        const h = hst(d.tanam);
        cards += `<div class="bed" style="border-top-color:${col}" onclick="openBed('${b.id+i}')">
          <div class="top"><div class="id">Bedengan ${b.id}-${i}</div><div class="emo">${emo}</div></div>
          <div class="crop">${d.crop}${d.varietas?" • "+d.varietas:""}</div>
          <div class="hst">HST ${h}</div>
          <div class="bar"><i style="width:${Math.min(100,h/1.2)}%;background:${col}"></i></div>
          ${fertInfo(d)}</div>`;
      } else {
        cards += `<div class="bed empty" onclick="openBed('${b.id+i}')">
          <div class="top"><div class="id">Bedengan ${b.id}-${i}</div><div class="emo">🌱</div></div>
          <div class="crop">kosong — klik untuk tanam</div>
          <div class="plus">+</div></div>`;
      }
    }
  }
  document.getElementById("grid").innerHTML = cards;
  renderStats();
}
function fertInfo(d){
  if(!d.fert||!d.fert.length) return "";
  const h = hst(d.tanam);
  let next = d.fert.filter(f=>!f.done).sort((a,b)=>a.hst-b.hst)[0];
  if(!next) return `<div class="fert done">✔ Semua pemupukan selesai</div>`;
  const diff = next.hst - h;
  if(diff < 0) return `<div class="fert over">⛔ ${next.nama} telat ${-diff} hr (HST ${next.hst})</div>`;
  if(diff <= 3) return `<div class="fert soon">⏰ ${next.nama} dalam ${diff} hr (HST ${next.hst})</div>`;
  return `<div class="fert ok">🧪 ${next.nama}: HST ${next.hst} (−${diff} hr)</div>`;
}

/* ================= MODAL ================= */
function cropOptions(sel){
  let h = `<option value="" ${!sel?"selected":""}>— Kosong / Belum tanam —</option>`;
  CROP_CATALOG.forEach(g=>{ h += `<optgroup label="🌿 ${g.cat}">` +
    g.items.map(c=>`<option value="${c}" ${sel===c?"selected":""}>${cropStyle(c)[1]} ${c}</option>`).join("") + `</optgroup>`; });
  h += `<optgroup label="Lainnya">` + EXTRA.map(c=>`<option value="${c}" ${sel===c?"selected":""}>${cropStyle(c)[1]} ${c}</option>`).join("") + `</optgroup>`;
  return h;
}
function openBed(key){
  curBed = key;
  const d = state.data[key] || {};
  const blk = BLOCKS.find(b=>key.startsWith(b.id));
  document.getElementById("mTitle").innerHTML = key==="A1"
    ? `☕ Blok A — Lahan Kopi`
    : `🟩 Bedengan ${key.replace(/(\D)(\d+)/,"$1-$2")}`;
  document.getElementById("mSub").textContent = (blk?blk.name:"") + " — lengkapi data lalu klik Simpan";
  document.getElementById("mCrop").innerHTML = cropOptions(d.crop);
  document.getElementById("mVar").value = d.varietas||"";
  document.getElementById("mDate").value = d.tanam||today();
  renderFert(d.fert||[]);
  updateModalHST();
  document.getElementById("mHist").innerHTML = (state.hist[key]||[]).slice(-4).reverse()
    .map(h=>`<b>Riwayat:</b> ${h.crop||"kosong"} • tanam ${h.tanam||"-"} • ${h.ts}`).join("<br>") || "Belum ada riwayat.";
  document.getElementById("overlay").classList.add("show");
}
function renderFert(list){
  document.getElementById("mFert").innerHTML = list.map(f=>`
    <div class="fert-item">
      <input type="text" class="f-nama" placeholder="mis. NPK / Dolomit / KCL" value="${f.nama||""}">
      <input type="number" class="f-hst" placeholder="HST" value="${f.hst||""}" min="0">
      <button class="btn-sm btn-x" onclick="this.parentElement.remove()">✕</button>
    </div>`).join("");
}
document.getElementById("addFert").onclick = ()=>{
  const div = document.createElement("div"); div.className="fert-item";
  div.innerHTML = `<input type="text" class="f-nama" placeholder="mis. NPK / Dolomit / KCL">
    <input type="number" class="f-hst" placeholder="HST" min="0">
    <button class="btn-sm btn-x" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById("mFert").appendChild(div);
};
function updateModalHST(){
  const h = hst(document.getElementById("mDate").value);
  document.getElementById("mHST").value = h!==null ? h+" hari" : "-";
  document.getElementById("mStatus").value = h===null?"-": h<7?"Fase Semai / Awal": h<30?"Fase Vegetatif": h<60?"Fase Generatif":"Menuju Panen";
}
document.getElementById("mDate").addEventListener("change", updateModalHST);

document.getElementById("saveBtn").onclick = ()=>{
  const crop = document.getElementById("mCrop").value;
  const old = state.data[curBed]||{};
  if(old.crop){ (state.hist[curBed]=state.hist[curBed]||[]).push({crop:old.crop,tanam:old.tanam,ts:today()}); }
  if(!crop){ delete state.data[curBed]; }
  else {
    const fert = [...document.querySelectorAll("#mFert .fert-item")].map(el=>({
      nama: el.querySelector(".f-nama").value.trim(),
      hst: parseInt(el.querySelector(".f-hst").value)||0, done:false
    })).filter(f=>f.nama);
    state.data[curBed] = {crop, varietas:document.getElementById("mVar").value.trim(),
      tanam:document.getElementById("mDate").value, fert};
  }
  save(); closeModal(); renderTabs(); renderBlock();
};
document.getElementById("harvBtn").onclick = ()=>{
  const d = state.data[curBed];
  if(d && d.crop){ (state.hist[curBed]=state.hist[curBed]||[]).push({crop:d.crop+" (PANEN)",tanam:d.tanam,ts:today()}); }
  delete state.data[curBed]; save(); closeModal(); renderTabs(); renderBlock();
};
document.getElementById("delBtn").onclick = ()=>{
  delete state.data[curBed]; delete state.hist[curBed]; save(); closeModal(); renderTabs(); renderBlock();
};
document.getElementById("closeBtn").onclick = closeModal;
document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
function closeModal(){ document.getElementById("overlay").classList.remove("show"); }

/* ================= EXPORT / IMPORT ================= */
document.getElementById("exportBtn").onclick = ()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
  a.download="data-bedengan-"+today()+".json"; a.click(); };
document.getElementById("importBtn").onclick = ()=>{
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange=()=>{ const r=new FileReader(); r.onload=()=>{ try{ state=JSON.parse(r.result); save(); renderTabs(); renderBlock(); alert("Data berhasil diimpor."); }catch(e){alert("File tidak valid.");} }; r.readAsText(inp.files[0]); };
  inp.click(); };

/* ================= INIT ================= */
renderTabs(); renderBlock();
setInterval(()=>{ renderBlock(); }, 60000);
</script>
</body>
</html>
